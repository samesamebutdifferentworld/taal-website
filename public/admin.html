<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin: taal</title>
<meta name="robots" content="noindex">
<style>
@font-face { font-family:'Funnel Sans'; src:url('/fonts/funnel-sans.woff2') format('woff2'); font-weight:300 800; font-display:swap; }
@font-face { font-family:'Funnel Display'; src:url('/fonts/funnel-display.woff2') format('woff2'); font-weight:300 800; font-display:swap; }
:root { --paper:#F2F3EE; --ink:#13201E; --mute:#55625F; --rule:#D3DAD3; --green:#0F5C57; --tint:#E3E9E3; --amber:#F3E7C9; --seal:#A8382B; }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:'Funnel Sans', system-ui, sans-serif; font-size:16px; line-height:1.5; }
main { max-width:1140px; margin:0 auto; padding:28px 20px 80px; }
h1 { font-family:'Funnel Display', sans-serif; font-size:34px; letter-spacing:-0.02em; margin:0; }
h2 { font-family:'Funnel Display', sans-serif; font-size:24px; letter-spacing:-0.02em; margin:0 0 12px; }
h3 { font-family:'Funnel Display', sans-serif; font-size:17px; margin:20px 0 8px; }
a { color:var(--green); }
input, select, textarea, button { font:inherit; padding:9px 12px; border-radius:10px; border:1.5px solid var(--rule); background:#fff; color:var(--ink); }
textarea { width:100%; min-height:80px; }
button { background:var(--ink); color:var(--paper); border:0; font-weight:600; cursor:pointer; }
button.ghost { background:#fff; color:var(--green); box-shadow:inset 0 0 0 1.5px var(--green); }
button.green { background:var(--green); }
button:disabled { opacity:.5; cursor:default; }
.bar { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
.tabs { display:flex; gap:6px; }
.tabs button { background:#fff; color:var(--ink); }
.tabs button[aria-selected=true] { background:var(--ink); color:var(--paper); }
table { width:100%; border-collapse:collapse; background:#fff; border-radius:16px; overflow:hidden; }
th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--rule); vertical-align:top; font-size:15px; }
th { font-weight:600; color:var(--mute); font-size:13.5px; }
tr.click { cursor:pointer; }
tr.click:hover td { background:#F7F8F4; }
.tag { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12.5px; font-weight:600; background:var(--tint); color:var(--green); white-space:nowrap; }
.tag.wait { background:var(--amber); color:#6B4B12; }
.tag.you { background:var(--seal); color:#fff; }
.mute { color:var(--mute); font-size:13.5px; }
.ref { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; font-weight:600; background:#E3E9E3; color:var(--green); }
.partners { display:flex; flex-wrap:wrap; gap:10px; margin:0 0 18px; }
.partners div { background:#fff; border-radius:14px; padding:10px 14px; font-size:14px; }
.partners b { font-family:'Funnel Display', sans-serif; font-size:18px; }
.off { text-decoration:line-through; color:var(--mute); }
.panel { background:#fff; border-radius:18px; padding:22px; margin-bottom:16px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px 16px; }
label.f { display:block; font-size:14px; font-weight:600; }
label.f input, label.f select { display:block; width:100%; margin-top:5px; font-weight:400; }
label.c { display:flex; gap:8px; align-items:center; font-size:15px; }
dl.kv { display:grid; grid-template-columns:170px 1fr; gap:6px 14px; margin:0; font-size:15px; }
dl.kv dt { color:var(--mute); }
dl.kv dd { margin:0; white-space:pre-wrap; word-break:break-word; }
.actions { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px; }
.cols { display:grid; grid-template-columns:1.2fr 1fr; gap:16px; align-items:start; }
.files { display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:8px; }
.files a { display:block; background:var(--paper); border-radius:10px; padding:8px; font-size:12px; text-decoration:none; color:var(--ink); word-break:break-all; }
.log { font-size:13.5px; color:var(--mute); max-height:260px; overflow:auto; }
.log div { padding:4px 0; border-bottom:1px solid var(--paper); }
pre { background:var(--paper); border-radius:12px; padding:12px; font-size:12.5px; max-height:360px; overflow:auto; white-space:pre-wrap; }
.msg { color:#9B2C1F; margin-top:10px; min-height:1em; }
.lead-x td { background:#FAFBF8; }
@media (max-width:820px) { .cols { grid-template-columns:1fr; } .hide-sm { display:none; } dl.kv { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <div class="bar"><h1>taal admin</h1><div class="tabs" id="tabs" hidden><button id="tLeads" aria-selected="true">Leads</button><button id="tClients" aria-selected="false">Clients</button><button class="green" id="tNew">New agreement</button></div></div>
  <form id="login"><input type="password" id="key" placeholder="Admin key" autocomplete="current-password" aria-label="Admin key"> <button>Sign in</button><p class="msg" id="msg"></p></form>
  <div id="view"></div>
</main>
<script>
(function () {
  const $ = id => document.getElementById(id);
  let key = sessionStorage.getItem('taalAdmin') || '';
  let leads = [], clients = [];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const date = iso => iso ? new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
  const when = iso => iso ? new Date(iso).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  const gbp = n => '£' + Number(n).toLocaleString('en-GB');
  const req = async (p, o = {}) => {
    const r = await fetch('/api/admin/' + p, { ...o, headers: { authorization: 'Bearer ' + key, ...(o.body ? { 'content-type': 'application/json' } : {}) } });
    if (r.status === 401) { sessionStorage.removeItem('taalAdmin'); throw new Error('That key didn\'t work.'); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Failed (' + r.status + ')');
    return j;
  };
  const post = (p, body) => req(p, { method: 'POST', body: JSON.stringify(body) });
  const kinds = { fitness: 'Fitness', wellness: 'Wellness', yoga: 'Yoga and Pilates', pilates: 'Pilates', dance: 'Dance', martial: 'Martial arts', climbing: 'Climbing' };
  const STAGE = { offered: 'Agreement sent', signed: 'Signed', building: 'Building', review: 'In review', approved: 'Approved', live: 'Live' };

  function tab(t) {
    ['tLeads', 'tClients'].forEach(id => $(id).setAttribute('aria-selected', String(id === t)));
  }

  /* ---------- Leads ---------- */
  async function showLeads() {
    tab('tLeads'); history.replaceState(null, '', '#leads');
    ({ leads } = await req('leads'));
    const live = x => x.expires_at && new Date(x.expires_at) > new Date();
    const offered = new Set(clients.map(c => (c.email || '').toLowerCase()));
    const what = x => {
      if (x.type === 'call' && x.booked) {
        const sum = x.summary_at ? `Summary sent ${date(x.summary_at)}${x.follow2_at ? ', both follow-ups sent' : x.follow1_at ? ', follow-up sent' : ''}` : x.summary_hold ? 'Summary on hold' : 'Summary goes an hour after the call';
        return `<b class="${x.cancelled ? 'off' : ''}">Call booked</b>${x.cancelled ? ' <span class="mute">cancelled</span>' : ''}<br><span class="mute">${esc(when(x.call_at))}</span><br><span class="mute">${esc(sum)}</span>`;
      }
      if (x.type === 'call') return `<b>Wants a call</b>${x.package ? `<br><span class="mute">${esc(x.package)}</span>` : ''}`;
      return (live(x) ? `<a href="${esc(x.member_url)}" target="_blank" rel="noopener">App</a>&nbsp;&nbsp; <a href="${esc(x.admin_url)}" target="_blank" rel="noopener">Back office</a><br><span class="mute">until ${date(x.expires_at)}</span>` : '<span class="mute">Demo deleted</span>') + (x.nudged ? '<br><span class="mute">Follow-up sent</span>' : '');
    };
    const by = {};
    leads.forEach(x => { if (!x.ref) return; const p = by[x.ref] = by[x.ref] || { demos: 0, calls: 0 }; if (x.type === 'call') { if (!x.cancelled) p.calls++; } else p.demos++; });
    const partners = Object.entries(by).sort((a, b) => (b[1].demos + b[1].calls) - (a[1].demos + a[1].calls));
    $('view').innerHTML = (partners.length ? `<div class="partners">${partners.map(([r, p]) => `<div><span class="ref">${esc(r)}</span><br><b>${p.demos}</b> demos &nbsp;<b>${p.calls}</b> calls</div>`).join('')}</div>` : '') +
      (leads.length ? `<table><thead><tr><th>Date</th><th>Studio</th><th class="hide-sm">Type</th><th class="hide-sm">Name</th><th>Email</th><th>Demo or call</th><th>Partner</th></tr></thead><tbody>${
      leads.map((x, i) => `<tr class="click" data-i="${i}"><td>${date(x.created_at)}</td><td><b class="${x.closed ? 'off' : ''}">${esc(x.studio)}</b>${offered.has((x.email || '').toLowerCase()) ? '<br><span class="tag">Agreement sent</span>' : ''}</td><td class="hide-sm">${esc(kinds[x.kind] || '')}</td><td class="hide-sm">${esc(x.name)}</td><td><a href="mailto:${esc(x.email)}">${esc(x.email)}</a>${x.phone ? `<br><a href="tel:${esc(x.phone)}">${esc(x.phone)}</a>` : ''}</td><td>${what(x)}</td><td>${x.ref ? `<span class="ref">${esc(x.ref)}</span>` : ''}</td></tr>`).join('')
    }</tbody></table>` : '<p>Nobody has built a demo or booked a call yet.</p>');
    document.querySelectorAll('tr.click').forEach(tr => tr.addEventListener('click', ev => { if (ev.target.closest('a')) return; openLead(tr, leads[+tr.dataset.i]); }));
  }

  function openLead(tr, x) {
    const open = tr.nextElementSibling && tr.nextElementSibling.classList.contains('lead-x');
    document.querySelectorAll('tr.lead-x').forEach(r => r.remove());
    if (open) return;
    const row = document.createElement('tr');
    row.className = 'lead-x';
    const isCall = x.type === 'call' && x.booked;
    row.innerHTML = `<td colspan="7"><div class="cols"><div>
      ${isCall ? `<label class="f">Personal note for the call summary <span class="mute">(goes at the top of the email an hour after the call)</span><textarea id="lNote">${esc(x.summary_note || '')}</textarea></label>
      <div class="actions"><button class="green" id="lSave">Save note</button><label class="c"><input type="checkbox" id="lHold" ${x.summary_hold ? 'checked' : ''}> Don't send the summary</label></div>` : ''}
      <div class="actions"><button id="lOffer">Send an agreement</button><label class="c"><input type="checkbox" id="lClosed" ${x.closed ? 'checked' : ''}> Not going ahead (stops follow-ups)</label></div>
      <p class="msg" id="lMsg"></p></div>
      <div><dl class="kv">${[['Studio', x.studio], ['Name', x.name], ['Email', x.email], ['Phone', x.phone], ['Looking at', x.package], ['Note', x.note || x.notes], ['Partner', x.ref]].filter(r => r[1]).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div></div></td>`;
    tr.after(row);
    const upd = body => post('leads/' + encodeURIComponent(x.id), body).then(r => { Object.assign(x, r.lead); $('lMsg').textContent = 'Saved.'; }).catch(e => { $('lMsg').textContent = e.message; });
    if (isCall) {
      $('lSave').onclick = () => upd({ summary_note: $('lNote').value });
      $('lHold').onchange = () => upd({ summary_hold: $('lHold').checked });
    }
    $('lClosed').onchange = () => upd({ closed: $('lClosed').checked });
    $('lOffer').onclick = () => showNew(x);
  }

  /* ---------- New agreement ---------- */
  function showNew(lead = {}) {
    tab(''); history.replaceState(null, '', '#new');
    const pkg = (lead.package || '').toLowerCase();
    $('view').innerHTML = `<div class="panel"><h2>New agreement</h2>
      <p class="mute" style="margin:0 0 16px">Makes their private portal and emails them a link to read and sign. Invoices go out automatically once they sign.</p>
      <form id="nf"><div class="grid">
        <label class="f">Studio<input name="studio" required value="${esc(lead.studio || '')}"></label>
        <label class="f">Contact name<input name="name" value="${esc(lead.name || '')}"></label>
        <label class="f">Email<input name="email" type="email" required value="${esc(lead.email || '')}"></label>
        <label class="f">Phone<input name="phone" value="${esc(lead.phone || '')}"></label>
        <label class="f">Kind of studio<select name="kind">${Object.entries(kinds).filter(([k]) => k !== 'pilates').map(([k, v]) => `<option value="${k}" ${lead.kind === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
        <label class="f">Partner code<input name="ref" value="${esc(lead.ref || '')}"></label>
        <label class="f">How they pay<select name="plan"><option value="once">Once, in two parts</option><option value="12">Over 12 months</option><option value="24">Over 24 months</option></select></label>
      </div>
      <div class="actions" style="margin:16px 0">
        <label class="c"><input type="checkbox" checked disabled> Booking system</label>
        <label class="c"><input type="checkbox" name="apps" ${/app/.test(pkg) ? 'checked' : ''}> Own apps</label>
        <label class="c"><input type="checkbox" name="site" ${/site|web/.test(pkg) ? 'checked' : ''}> Website</label>
        <label class="c"><input type="checkbox" name="care"> Care plan</label>
        <label class="c"><input type="checkbox" name="founding"> Founding offer (30% off)</label>
      </div>
      <p id="quote" style="font-size:18px;margin:0 0 14px"></p>
      <label class="f">Your notes (only you see these)<textarea name="notes"></textarea></label>
      <div class="actions" style="margin-top:12px"><button class="green">Send the agreement</button><label class="c"><input type="checkbox" name="send" checked> Email it now</label></div>
      <p class="msg" id="nMsg"></p></form></div>`;
    const f = $('nf');
    const ITEMS = { base: [1900, 400, 150, 300, 90], apps: [1000, 200, 85, 100, 50], site: [800, 200, 65, 200, 35] };
    const q = () => {
      const keys = ['base', ...(f.apps.checked ? ['apps'] : []), ...(f.site.checked ? ['site'] : [])];
      const cut = v => Math.round(v * (f.founding.checked ? .7 : 1));
      const plan = f.plan.value;
      if (plan === 'once') { const t = keys.reduce((s, k) => s + cut(ITEMS[k][0]), 0); return `${gbp(t)}: ${gbp(Math.ceil(t / 2))} on signing, ${gbp(t - Math.ceil(t / 2))} at go-live`; }
      const o = plan === '12' ? 1 : 3, m = plan === '12' ? 12 : 24;
      const s = keys.reduce((t, k) => t + cut(ITEMS[k][o]), 0), mo = keys.reduce((t, k) => t + cut(ITEMS[k][o + 1]), 0);
      return `${gbp(s)} on signing, then ${gbp(mo)} a month for ${m} months (${gbp(s + mo * m)})`;
    };
    const upd = () => { $('quote').textContent = q(); };
    f.addEventListener('change', upd); upd();
    f.addEventListener('submit', async ev => {
      ev.preventDefault();
      const b = { studio: f.studio.value, name: f.name.value, email: f.email.value, phone: f.phone.value, kind: f.kind.value, ref: f.ref.value, plan: f.plan.value, apps: f.apps.checked, site: f.site.checked, care: f.care.checked, founding: f.founding.checked, notes: f.notes.value, send: f.send.checked, lead_id: lead.id || '' };
      try { const r = await post('clients', b); clients = (await req('clients')).clients; showClient(r.client.id, r.emailed ? 'Agreement emailed.' : 'Made. The email did not go: copy the portal link below.'); }
      catch (e) { $('nMsg').textContent = e.message; }
    });
  }

  /* ---------- Clients ---------- */
  async function showClients() {
    tab('tClients'); history.replaceState(null, '', '#clients');
    ({ clients } = await req('clients'));
    $('view').innerHTML = clients.length ? `<table><thead><tr><th>Studio</th><th>Stage</th><th>Next step</th><th class="hide-sm">Contact</th><th class="hide-sm">Since</th><th>Partner</th></tr></thead><tbody>${
      clients.map(c => `<tr class="click" data-id="${esc(c.id)}"><td><b>${esc(c.studio)}</b></td><td><span class="tag">${esc(STAGE[c.stage] || c.stage)}</span></td><td>${c.waiting ? `<span class="tag ${/^You/.test(c.waiting) ? 'you' : 'wait'}">${esc(c.waiting)}</span>` : ''}</td><td class="hide-sm">${esc(c.name)}<br><span class="mute">${esc(c.email)}</span></td><td class="hide-sm">${date(c.created_at)}</td><td>${c.ref ? `<span class="ref">${esc(c.ref)}</span>` : ''}</td></tr>`).join('')
    }</tbody></table>` : '<div class="panel"><p style="margin:0">No agreements yet. Open a lead and choose "Send an agreement", or use New agreement.</p></div>';
    document.querySelectorAll('tr.click').forEach(tr => tr.addEventListener('click', () => showClient(tr.dataset.id)));
  }

  async function showClient(id, flash = '') {
    tab('tClients'); history.replaceState(null, '', '#client=' + id);
    const { client: c } = await req('clients/' + id);
    const q = c.quote;
    const act = async (body, ok) => { try { const r = await post('clients/' + id, body); render(r.client, ok || 'Done.'); } catch (e) { $('cMsg').textContent = e.message; } };
    const render = (c, note = '') => {
      const files = c.files || [];
      const inv = (c.invoices || []).map(i => `<tr><td>${esc(i.label)}${i.number ? `<br><span class="mute">${esc(i.number)}</span>` : ''}${i.error ? `<br><span class="mute" style="color:#9B2C1F">${esc(i.error)}</span>` : ''}</td><td>${gbp(i.amount)}${i.kind === 'monthly' ? ' /mo' : ''}</td><td><span class="tag ${i.status === 'paid' || i.status === 'active' ? '' : 'wait'}">${esc(i.status === 'manual' ? 'Send by hand' : i.status)}</span>${i.payments ? ` <span class="mute">${i.payments} paid</span>` : ''}</td><td>${i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">Link</a>` : ''} ${i.status !== 'paid' && i.kind === 'invoice' ? `<button class="ghost" data-paid="${esc(i.ref)}" style="padding:4px 10px;font-size:13px">Mark paid</button>` : ''}</td></tr>`).join('');
      const b = c.brief || {};
      const accDone = (c.needs || []).map(a => `${c.accounts && c.accounts[a] ? '✓' : '·'} ${a}`).join('   ');
      const step = c.waiting ? `<span class="tag ${/^You/.test(c.waiting) ? 'you' : 'wait'}">${esc(c.waiting)}</span>` : '';
      $('view').innerHTML = `<p><a href="#clients" id="back">← All clients</a></p>
      <div class="panel"><div class="bar" style="margin:0 0 10px"><h2 style="margin:0">${esc(c.studio)} <span class="tag">${esc(STAGE[c.stage])}</span> ${step}</h2>
        <span><a href="${esc(c.portal_url)}" target="_blank" rel="noopener">Their portal</a> &nbsp; <button class="ghost" id="copy" style="padding:5px 12px">Copy link</button></span></div>
        <div class="actions">
          ${c.stage === 'offered' ? '<button id="aResend">Email the agreement again</button>' : ''}
          ${c.signed && !c.countersigned ? '<button class="green" id="aCounter">Countersign</button>' : ''}
          ${c.signed ? '<button id="aDemo">Build demo from their details</button>' : ''}
          ${c.demo ? `<button class="${c.stage === 'building' ? 'green' : ''}" id="aReview">${c.review_sent ? 'Send updated review link' : 'Send for review'}</button>` : ''}
          ${c.approved && c.stage !== 'live' ? '<button class="green" id="aLive">Mark live (sends final invoice or Direct Debit)</button>' : ''}
          ${c.stage === 'live' && c.order.care ? '<button id="aCare">Care plan Direct Debit link</button>' : ''}
        </div>
        <p class="msg" id="cMsg">${esc(note)}</p></div>
      <div class="cols"><div>
        <div class="panel"><h3 style="margin-top:0">Order</h3><dl class="kv">
          <dt>Chose</dt><dd>${q.lines.map(l => esc(l.label)).join(', ')}${c.order.care ? ', care plan' : ''}</dd>
          <dt>Pays</dt><dd>${esc(c.pay_line)}${q.founding ? ' (founding)' : ''}</dd>
          <dt>Contact</dt><dd>${esc(c.name)}, <a href="mailto:${esc(c.email)}">${esc(c.email)}</a>${c.phone ? ', ' + esc(c.phone) : ''}</dd>
          ${c.party ? `<dt>Legal name</dt><dd>${esc(c.party.legal_name)}${c.party.company_number ? ` (${esc(c.party.company_number)})` : ''}</dd><dt>Address</dt><dd>${esc(c.party.address)}</dd>` : ''}
          <dt>Signed</dt><dd>${c.signed ? `${esc(c.signed.name)}, ${when(c.signed.at)}` : 'Not yet'}${c.countersigned ? `<br>Countersigned ${when(c.countersigned.at)}` : ''} ${c.signed ? `<a href="${esc(c.agreement_url)}" target="_blank" rel="noopener">Agreement</a>` : ''}</dd>
          <dt>Partner</dt><dd>${esc(c.ref || '')}</dd>
          <dt>Go-live date</dt><dd><input type="date" id="goLive" value="${esc(c.go_live || '')}" style="padding:4px 8px"></dd>
        </dl></div>
        <div class="panel"><h3 style="margin-top:0">Payments</h3>${inv ? `<table>${inv}</table>` : '<p class="mute" style="margin:0">Invoices appear when they sign.</p>'}</div>
        <div class="panel"><h3 style="margin-top:0">Their details</h3>
          <p class="mute" style="margin:0 0 8px">${c.brief_submitted ? `Sent ${when(c.brief_submitted)}` : 'Not sent yet'}. ${c.missing.length ? 'Missing: ' + esc(c.missing.join(', ')) : 'Nothing missing.'}</p>
          <dl class="kv">
            <dt>Classes</dt><dd>${esc((b.classes || []).map(x => x.name).filter(Boolean).join(', '))}</dd>
            <dt>Timetable</dt><dd>${(b.timetable || []).length} slots</dd>
            <dt>Treatments</dt><dd>${esc((b.treatments || []).map(x => x.name + (x.price ? ` £${x.price}` : '')).join(', '))}</dd>
            <dt>Memberships</dt><dd>${esc((b.memberships || []).map(x => x.name + (x.price ? ` £${x.price}` : '')).join(', '))}</dd>
            <dt>Packs</dt><dd>${esc((b.packs || []).map(x => x.name + (x.price ? ` £${x.price}` : '')).join(', '))}</dd>
            <dt>Team</dt><dd>${esc((b.team || []).map(x => x.name).filter(Boolean).join(', '))}</dd>
            <dt>Colours</dt><dd>${esc([(b.brand || {}).colour, (b.brand || {}).accent].filter(Boolean).join(' and '))} ${esc((b.brand || {}).font || '')}</dd>
            <dt>Accounts</dt><dd>${esc(accDone)}</dd>
          </dl>
          ${files.length ? `<h3>Files</h3><div class="files">${files.map(f => `<a href="#" data-file="${esc(f.id)}" data-name="${esc(f.name)}"><b>${esc(f.section)}</b><br>${esc(f.name)}</a>`).join('')}</div>` : ''}
          <details style="margin-top:12px"><summary class="mute">Everything they sent, as JSON</summary><pre>${esc(JSON.stringify(b, null, 2))}</pre></details>
        </div>
      </div><div>
        ${c.demo ? `<div class="panel"><h3 style="margin-top:0">Demo</h3><p style="margin:0 0 8px"><a href="${esc(c.demo.member_url)}" target="_blank" rel="noopener">App</a> &nbsp; <a href="${esc(c.demo.admin_url)}" target="_blank" rel="noopener">Back office</a> <span class="mute">${esc(c.demo.slug)}</span></p>${c.review_sent ? `<p class="mute" style="margin:0">Review sent ${when(c.review_sent)}${c.approved ? `; approved ${when(c.approved.at)}` : ''}</p>` : ''}</div>` : ''}
        <div class="panel"><h3 style="margin-top:0">Use a different demo</h3><p class="mute" style="margin:0 0 8px">If you've changed one by hand, paste its address ending to review that one.</p><div class="actions"><input id="slug" placeholder="flow-yoga-k3x9p"><button class="ghost" id="aSlug">Use it</button></div></div>
        ${(c.requests || []).length ? `<div class="panel"><h3 style="margin-top:0">Change requests</h3>${c.requests.slice().reverse().map(r => `<p style="margin:0 0 10px;white-space:pre-wrap"><span class="mute">${when(r.at)}</span><br>${esc(r.text)}</p>`).join('')}</div>` : ''}
        <div class="panel"><h3 style="margin-top:0">Your notes</h3><textarea id="notes">${esc(c.notes || '')}</textarea><div class="actions"><button class="ghost" id="aNotes">Save notes</button></div></div>
        <div class="panel"><h3 style="margin-top:0">History</h3><div class="log">${(c.log || []).slice().reverse().map(l => `<div>${when(l.at)}: ${esc(l.what)}</div>`).join('')}</div></div>
      </div></div>`;
      const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
      on('back', e => { e.preventDefault(); showClients(); });
      on('copy', () => navigator.clipboard.writeText(c.portal_url).then(() => { $('cMsg').textContent = 'Portal link copied.'; }));
      on('aResend', () => act({ do: 'resend' }, 'Agreement emailed again.'));
      on('aCounter', () => act({ do: 'countersign' }, 'Countersigned and emailed.'));
      on('aDemo', () => { $('cMsg').textContent = 'Building their demo…'; act({ do: 'demo' }, 'Demo built. Check it, change anything by hand, then send for review.'); });
      on('aReview', () => confirm('Email them the review link?') && act({ do: 'review' }, 'Review link sent.'));
      on('aLive', () => confirm('Mark them live? This sends the final invoice or the Direct Debit link and the "you\'re live" email.') && act({ do: 'live' }, 'Live.'));
      on('aCare', () => act({ do: 'care_link' }, 'Care plan link made.'));
      on('aNotes', () => act({ do: 'note', notes: $('notes').value }, 'Notes saved.'));
      on('aSlug', () => act({ do: 'demo_link', slug: $('slug').value }, 'Demo set.'));
      $('goLive').onchange = () => act({ do: 'go_live', date: $('goLive').value }, 'Go-live date saved.');
      document.querySelectorAll('[data-paid]').forEach(b => b.onclick = () => act({ do: 'paid', ref: b.dataset.paid }, 'Marked paid.'));
      document.querySelectorAll('[data-file]').forEach(a => a.onclick = async ev => {
        ev.preventDefault();
        const r = await fetch(`/api/admin/clients/${id}/files/${a.dataset.file}`, { headers: { authorization: 'Bearer ' + key } });
        const url = URL.createObjectURL(await r.blob());
        const dl = document.createElement('a'); dl.href = url; dl.download = a.dataset.name; dl.click(); setTimeout(() => URL.revokeObjectURL(url), 2000);
      });
    };
    render(c, flash);
  }

  async function start() {
    ({ clients } = await req('clients'));
    sessionStorage.setItem('taalAdmin', key);
    $('login').hidden = true; $('tabs').hidden = false;
    $('tLeads').onclick = () => showLeads();
    $('tClients').onclick = () => showClients();
    $('tNew').onclick = () => showNew();
    const h = location.hash;
    if (h.startsWith('#client=')) return showClient(h.slice(8));
    if (h === '#clients') return showClients();
    if (h === '#new') return showNew();
    return showLeads();
  }

  $('login').addEventListener('submit', ev => { ev.preventDefault(); key = $('key').value.trim(); start().catch(err => { $('msg').textContent = err.message; }); });
  if (key) start().catch(() => {});
})();
</script>
</body>
</html>
